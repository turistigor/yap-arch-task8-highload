apiVersion: v1
kind: Namespace
metadata:
  name: highload
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: highload
  name: scaletest-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletest-pod
  template:
    metadata:
      labels:
        app: scaletest-pod
    spec:
      containers:
      - name: scale-test-app
        image: ghcr.io/yandex-practicum/scaletestapp
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "30Mi"
            cpu: "500m"
          limits:
            memory: "60Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
          name: scaletest-port
---
apiVersion: v1
kind: Service
metadata:
  name: scaletest-service
  namespace: highload
spec:
  selector:
    app: scaletest-pod
  ports:
  - port: 8080
    protocol: TCP
    targetPort: scaletest-port
    nodePort: 30000
  type: NodePort
