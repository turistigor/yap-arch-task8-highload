type Client {
  id: String!
  name: String!
  age: Int!
  documents: [Document!]!
  relatives: [Relative!]!
}

type Document {
  id: String!
  type: String!
  number: String!
  issueDate: String!
  expiryDate: String!
}

type Query {
  client(id: String!): Client!
  documents(clientId: String!): [Document!]!
  relatives(clientId: String!): [Relative!]!
}

type Relative {
  id: String!
  relationType: String!
  name: String!
  age: Int!
}
